apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: digradation-rabbit
  # namespace: digradation
spec:
  serviceName: digradation-rabbit-service
  replicas: 1
  selector:
    matchLabels:
      app: rabbit
  template:
    metadata:
      labels:
        app: rabbit
    spec:
      containers:
        - name: rabbit
          image: rabbitmq:4-management-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: di-env
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: di-env
                  key: RABBITMQ_PASS
            - name: RABBITMQ_DEFAULT_VHOST
              value: taskiq
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 400m
              memory: 512Mi
          startupProbe:
            exec:
              command: ["nc", "-z", "127.0.0.1", "5672"]
              # Вообще так делать лучше не стоит. Но из-за того, что rabbitmq-diagnose требует 20 секунд на заупуск,
              # то ничего другого не остается. Иначе у нас при фейле контейнера или если сам ребит упал,
              # информация поступит лишь спустя секунд 50. (Если брать меньше у нас пробы не будут нормально отрабатывать)
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["nc", "-z", "127.0.0.1", "5672"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["nc", "-z", "127.0.0.1", "5672"]
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - name: rabbitmq-data
              mountPath: "/var/lib/rabbitmq"
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: digradation-rabbit-service
  # namespace: digradation
spec:
  clusterIP: None
  selector:
    app: rabbit
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
