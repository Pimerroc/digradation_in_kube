apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbit-pvc
  # namespace: digradation
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: digradation-rabbit
  # namespace: digradation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbit
  template:
    metadata:
      labels:
        app: rabbit
    spec:
      containers:
        - name: rabbit
          image: rabbitmq:4-management-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: admin
            - name: RABBITMQ_DEFAULT_PASS
              value: admin
            - name: RABBITMQ_DEFAULT_VHOST
              value: taskiq
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 200m
              memory: 384Mi
          startupProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_running"]
            periodSeconds: 10
            failureThreshold: 150
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_running"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_running"]
          volumeMounts:
            - name: rabbit-pv
              mountPath: "/var/lib/rabbitmq"
      volumes:
        - name: rabbit-pv
          persistentVolumeClaim:
            claimName: rabbit-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: digradation-rabbit
  # namespace: digradation
spec:
  selector:
    app: rabbit
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
