apiVersion: v1
data:
  artifacts.json: |
    {
      "Rules": [
        {
          "ID": "artifacts-cleanup",
          "Status": "Enabled",
          "Filter": {
            "Prefix": ""
          },
          "Expiration": {
            "Days": 1
          }
        }
      ]
    }
  avatars.json: |
    {
      "Rules": [
        {
          "ID": "avatars-unprocessed-cleanup",
          "Status": "Enabled",
          "Filter": {
            "Prefix": "avatars-unprocessed/"
          },
          "Expiration": {
            "Days": 1
          }
        }
      ]
    }
  uploads.json: |
    {
      "Rules": [
        {
          "ID": "attachments-cleanup",
          "Status": "Enabled",
          "Filter": {
            "Prefix": "attachments/"
          },
          "Expiration": {
            "Days": 7
          }
        }
      ]
    }
kind: ConfigMap
metadata:
  name: garage-rules
---
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-config
spec:
  template:
    metadata:
      name: garage-config
    spec:
      containers:
        - name: garage-config
          image: pimerroc/digradation-backend:latest
          command: ["poetry", "run", "python", "apply_s3_config.py"]
          env:
            - name: S3_INTERNAL_URL
              value: http://garage:3900
            - name: S3_CORS_ORIGINS
              value: "*"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: di-env
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: di-env
                  key: S3_SECRET_KEY
          volumeMounts:
            - name: rules
              mountPath: /rules
              readOnly: true
      volumes:
        - name: rules
          configMap:
            name: garage-rules
      restartPolicy: Never
  backoffLimit: 3
---
