apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-meta
  labels:
    app: garage-meta
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-data
  labels:
    app: garage-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir     = "/var/lib/garage/data"
    db_engine    = "lmdb"

    replication_factor = 1
    rpc_bind_addr   = "0.0.0.0:3901"
    rpc_public_addr = "garage:3901"

    [s3_api]
    api_bind_addr = "0.0.0.0:3900"
    s3_region = "garage"
    root_domain = ".s3.garage.localhost"

    [admin]
    admin_bind_addr = "0.0.0.0:3903"
kind: ConfigMap
metadata:
  name: garage-conf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: digradation-garage
  # namespace: digradation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
    spec:
      containers:
        - name: garage
          image: dxflrs/garage:v2.4.1
          imagePullPolicy: IfNotPresent
          command: ["/garage", "server", "--single-node"]
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: di-env
                  key: GARAGE_RPC_SECRET
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: di-env
                  key: GARAGE_ADMIN_TOKEN
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          startupProbe:
            exec:
              command: ["/garage", "--help"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 3900
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 3900
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - name: garage-data
              mountPath: "/var/lib/garage/data"
            - name: garage-meta
              mountPath: "/var/lib/garage/meta"
            - name: garage-conf
              mountPath: "/etc/garage.toml"
              subPath: garage.toml
              readOnly: true
      volumes:
        - name: garage-conf
          configMap:
            name: garage-conf
        - name: garage-meta
          persistentVolumeClaim:
            claimName: garage-meta
        - name: garage-data
          persistentVolumeClaim:
            claimName: garage-data
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  # namespace: digradation
spec:
  selector:
    app: garage
  ports:
    - name: s3
      port: 3900
      targetPort: 3900
    - name: rpc
      port: 3901
      targetPort: 3901
    - name: s3-admin
      port: 3903
      targetPort: 3903
