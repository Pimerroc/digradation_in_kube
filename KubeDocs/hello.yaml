apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: digradation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.28-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: digradation
spec:
  selector:
    app: hello
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello
  namespace: digradation
spec:
  parentRefs:
    - name: itmo-shared
      namespace: envoy-gateway-system
      sectionName: http-digradation
    - name: itmo-https
      kind: ListenerSet
      group: gateway.networking.k8s.io
      namespace: envoy-gateway-system
      sectionName: https-digradation
  hostnames:
    - app.digradation.mlops.goctf.online
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-ITMO-Namespace
                value: digradation
      backendRefs:
        - name: hello
          port: 80
